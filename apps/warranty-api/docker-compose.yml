# Local dev services. Values match .env.example.
#   Postgres  localhost:5432
#   RustFS    S3 API localhost:9000 · console http://localhost:9001/rustfs/console/ (jaminly / jaminly-dev-secret)
#   MailHog   SMTP localhost:1025 · inbox http://localhost:8025
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jaminly
      POSTGRES_PASSWORD: jaminly
      POSTGRES_DB: jaminly
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaminly"]
      interval: 5s
      retries: 10

  # S3-compatible object store (MinIO's images are no longer published).
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: jaminly
      RUSTFS_SECRET_KEY: jaminly-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [rustfs:/data]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      retries: 10

  # One-shot: creates the private receipts bucket and lets the web app upload to it
  # directly (CORS for the Expo web dev servers), then exits. Safe to rerun.
  rustfs-init:
    image: amazon/aws-cli
    depends_on:
      rustfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: jaminly
      AWS_SECRET_ACCESS_KEY: jaminly-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      CORS: '{"CORSRules":[{"AllowedOrigins":["http://localhost:8081","http://localhost:8082"],"AllowedMethods":["PUT","GET","HEAD"],"AllowedHeaders":["*"],"MaxAgeSeconds":3600}]}'
    entrypoint: >
      sh -c "(aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket jaminly-receipts 2>/dev/null ||
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket jaminly-receipts) &&
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket jaminly-receipts --cors-configuration \"$$CORS\""

  mailhog:
    image: mailhog/mailhog
    platform: linux/amd64 # no arm64 image; runs under emulation on Apple Silicon
    ports: ["1025:1025", "8025:8025"]

volumes:
  db:
  rustfs:
